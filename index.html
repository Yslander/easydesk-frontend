<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDesk - Acesso</title>
    
    <!-- Importando Fonte Inter do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ================= CSS: O Visual da Tela (Modernizado) ================= */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            /* Gradiente vibrante moderno */
            background: linear-gradient(135deg, #0f172a 0%, #312e81 100%);
            color: #1e293b;
        }

        .login-card {
            /* Efeito Glassmorphism (Vidro) */
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .login-card h2 {
            text-align: center;
            color: #0f172a;
            margin-top: 0;
            margin-bottom: 30px;
            font-weight: 700;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #475569;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            background-color: #f8fafc;
            transition: all 0.2s ease;
            font-family: 'Inter', sans-serif;
        }

        .input-group input:focus {
            outline: none;
            border-color: #4f46e5;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            font-family: 'Inter', sans-serif;
        }

        button:hover:not(:disabled) {
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.4);
            transform: translateY(-2px);
        }
        
        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background: #94a3b8;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        #mensagemErro {
            color: #ef4444;
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
        }

        .toggle-link {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #4f46e5;
            cursor: pointer;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .toggle-link:hover {
            color: #312e81;
            text-decoration: underline;
        }

        .oculto {
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- BLOCO DE LOGIN -->
        <div id="blocoLogin">
            <h2>EasyDesk</h2>
            <form id="formLogin">
                <div class="input-group">
                    <label for="emailLogin">E-mail Profissional</label>
                    <input type="email" id="emailLogin" required placeholder="ex: joao@empresa.com">
                </div>
                <div class="input-group">
                    <label for="senhaLogin">Senha</label>
                    <input type="password" id="senhaLogin" required placeholder="••••••••">
                </div>
                <button type="submit" id="btnEntrar">Acessar Sistema</button>
            </form>
            <div class="toggle-link" onclick="alternarTela()">Ainda não tem conta? Cadastre-se</div>
        </div>

        <!-- BLOCO DE CADASTRO -->
        <div id="blocoCadastro" class="oculto">
            <h2>Criar Conta</h2>
            <form id="formCadastro">
                <div class="input-group">
                    <label for="nomeCadastro">Nome Completo</label>
                    <input type="text" id="nomeCadastro" required placeholder="ex: João Silva">
                </div>
                <div class="input-group">
                    <label for="emailCadastro">E-mail Profissional</label>
                    <input type="email" id="emailCadastro" required placeholder="ex: joao@empresa.com">
                </div>
                <div class="input-group">
                    <label for="senhaCadastro">Senha</label>
                    <input type="password" id="senhaCadastro" required placeholder="Crie uma senha forte">
                </div>
                <button type="submit" id="btnCadastrar">Criar Conta</button>
            </form>
            <div class="toggle-link" onclick="alternarTela()">Já tem uma conta? Faça Login</div>
        </div>

        <div id="mensagemErro"></div>
    </div>

    <script>
        const blocoLogin = document.getElementById('blocoLogin');
        const blocoCadastro = document.getElementById('blocoCadastro');
        const divErro = document.getElementById('mensagemErro');

        function alternarTela() {
            blocoLogin.classList.toggle('oculto');
            blocoCadastro.classList.toggle('oculto');
            divErro.innerText = "";
            divErro.style.color = "#ef4444";
        }

        // --- LÓGICA DE LOGIN ---
        document.getElementById('formLogin').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 
            divErro.innerText = "";
            
            const btn = document.getElementById('btnEntrar');
            btn.disabled = true;
            btn.innerText = "Autenticando...";

            const emailDigitado = document.getElementById('emailLogin').value;
            const senhaDigitada = document.getElementById('senhaLogin').value;

            try {
                const resposta = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailDigitado, senha: senhaDigitada })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    localStorage.setItem('tokenEasyDesk', dados.token);
                    window.location.href = 'painel.html'; 
                } else {
                    divErro.style.color = "#ef4444";
                    divErro.innerText = dados.erro;
                    btn.disabled = false;
                    btn.innerText = "Acessar Sistema";
                }
            } catch (erro) {
                divErro.style.color = "#ef4444";
                divErro.innerText = "Erro de conexão. Verifique se o servidor backend está rodando.";
                btn.disabled = false;
                btn.innerText = "Acessar Sistema";
            }
        });

        // --- LÓGICA DE CADASTRO ---
        document.getElementById('formCadastro').addEventListener('submit', async function(evento) {
            evento.preventDefault(); 
            divErro.innerText = "";
            
            const btn = document.getElementById('btnCadastrar');
            btn.disabled = true;
            btn.innerText = "Criando conta...";

            const nomeDigitado = document.getElementById('nomeCadastro').value;
            const emailDigitado = document.getElementById('emailCadastro').value;
            const senhaDigitada = document.getElementById('senhaCadastro').value;

            try {
                const resposta = await fetch('http://localhost:3000/usuarios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome: nomeDigitado, email: emailDigitado, senha: senhaDigitada })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    divErro.style.color = "#10b981"; // Verde Tailwind
                    divErro.innerText = "Conta criada com sucesso! Redirecionando...";
                    setTimeout(() => { alternarTela(); }, 1500);
                } else {
                    divErro.style.color = "#ef4444";
                    divErro.innerText = dados.erro;
                }
            } catch (erro) {
                divErro.style.color = "#ef4444";
                divErro.innerText = "Erro de conexão. Verifique se o servidor backend está rodando.";
            } finally {
                btn.disabled = false;
                btn.innerText = "Criar Conta";
            }
        });
    </script>
</body>
</html>
