<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDesk - Login</title>
    <style>
        /* ================= CSS: O Visual da Tela ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Impede que o input vaze da caixa */
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #004494;
        }
        #mensagemErro {
            color: #dc3545;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Entrar no EasyDesk</h2>
        <form id="formLogin">
            <div class="input-group">
                <label for="email">E-mail Profissional</label>
                <input type="email" id="email" required placeholder="ex: joao@easydesk.com">
            </div>
            <div class="input-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha">
            </div>
            <button type="submit">Acessar Sistema</button>
        </form>
        <div id="mensagemErro"></div>
    </div>

    <script>
        // Captura o formulário assim que a tela carrega
        const form = document.getElementById('formLogin');
        const divErro = document.getElementById('mensagemErro');

        // Fica "escutando" o momento que o usuário clicar no botão de Entrar
        form.addEventListener('submit', async function(evento) {
            // Impede que a página recarregue (padrão do HTML)
            evento.preventDefault(); 
            
            // Limpa mensagens de erro antigas
            divErro.innerText = "";

            // Coleta o que o usuário digitou
            const emailDigitado = document.getElementById('email').value;
            const senhaDigitada = document.getElementById('senha').value;

            try {
                // Dispara o "cabo de rede" para o nosso servidor Node.js
                const resposta = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        email: emailDigitado,
                        senha: senhaDigitada
                    })
                });

                // Converte a resposta do servidor para entendermos
                const dados = await resposta.json();

                // Verifica a resposta HTTP
                if (resposta.ok) {
                    // O Login deu certo!
                    alert("Acesso Autorizado! Bem-vindo.");
                    
                    // Guarda o Crachá VIP (JWT) no bolso do navegador temporariamente
                    localStorage.setItem('tokenEasyDesk', dados.token);
                    
                    // Redireciona o usuário para a tela principal (que ainda vamos criar)
                    // window.location.href = 'painel.html'; 
                } else {
                    // O Login falhou (senha errada ou usuário não existe)
                    divErro.innerText = dados.erro;
                }

            } catch (erro) {
                // Se o servidor Node.js estiver desligado, cai aqui
                divErro.innerText = "Erro de conexão. Verifique se o servidor está rodando.";
            }
        });
    </script>
</body>
</html>
