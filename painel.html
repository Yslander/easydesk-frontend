<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDesk - Painel de Controle</title>
    <style>
        /* ================= CSS: Estilização Existente ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background-color: #0056b3;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h1 {
            margin: 0;
            font-size: 22px;
        }
        .btn-sair {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-sair:hover {
            background-color: #c82333;
        }
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .cabecalho-tabela {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .cabecalho-tabela h2 {
            margin: 0;
            color: #333;
        }
        .btn-novo-chamado {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-novo-chamado:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f1f1;
        }

        /* ================= CSS: O Novo Modal (Janela Flutuante) ================= */
        .modal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex; /* Invisível por padrão, controlado via JS */
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        /* Classe que ativa a exibição do modal */
        .modal-container.ativo {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-conteudo {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        .modal-conteudo h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .modal-botoes {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-cancelar {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-salvar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>EasyDesk - Central de Suporte</h1>
        <button class="btn-sair" onclick="fazerLogout()">Sair do Sistema</button>
    </div>

    <div class="container">
        <div class="cabecalho-tabela">
            <h2>Chamados Abertos</h2>
            <button class="btn-novo-chamado" onclick="abrirModal()">+ Novo Chamado</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Solicitante</th>
                    <th>Descrição</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr>
                    <td colspan="6" style="text-align: center; color: #777;">
                        Carregando chamados...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal-container" id="modalChamado">
        <div class="modal-conteudo">
            <h3>Abrir Novo Chamado</h3>
            <form id="formNovoChamado">
                <div class="form-group">
                    <label for="solicitante">Nome do Solicitante</label>
                    <input type="text" id="solicitante" required placeholder="Ex: Setor de Produção">
                </div>
                <div class="form-group">
                    <label for="prioridade">Nível de Prioridade</label>
                    <select id="prioridade">
                        <option value="Baixa">Baixa</option>
                        <option value="Média">Média</option>
                        <option value="Alta">Alta</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="descricao">Descrição do Problema</label>
                    <textarea id="descricao" rows="4" required placeholder="Detalhe a falha encontrada..."></textarea>
                </div>
                <div class="modal-botoes">
                    <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-salvar">Salvar Chamado</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Verificação de Segurança (Vigia)
        const token = localStorage.getItem('tokenEasyDesk');
        if (!token) {
            alert("Acesso negado! Por favor, faça o login.");
            window.location.href = 'index.html';
        }

        const corpoTabela = document.getElementById('corpoTabela');
        const modal = document.getElementById('modalChamado');
        const formChamado = document.getElementById('formNovoChamado');

        // Funções para Controle Visual do Modal
        function abrirModal() {
            modal.classList.add('ativo');
        }
        function fecharModal() {
            modal.classList.remove('ativo');
            formChamado.reset(); // Limpa os campos preenchidos
        }

        
        // READ: Função para carregar os dados na tabela
        async function carregarChamados() {
            try {
                const resposta = await fetch('https://easydesk-api.onrender.com/chamados', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resposta.ok) {
                    const chamados = await resposta.json();
                    corpoTabela.innerHTML = '';

                    chamados.forEach(chamado => {
                        const linha = document.createElement('tr');
                        
                        // Verifica se o chamado já está concluído para esconder o botão de concluir
                        const botaoConcluir = chamado.status !== 'Concluído' 
                            ? `<button onclick="concluirChamado(${chamado.id})" style="background: #007bff; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-right: 5px;">Concluir</button>` 
                            : `<span style="color: #28a745; font-weight: bold; margin-right: 10px;">✓ Resolvido</span>`;

                        linha.innerHTML = `
                            <td>${chamado.id}</td>
                            <td>${chamado.solicitante}</td>
                            <td>${chamado.descricao}</td>
                            <td>
                                <span style="font-weight: bold; color: ${chamado.prioridade === 'Alta' ? '#dc3545' : (chamado.prioridade === 'Média' ? '#ffc107' : '#28a745')}">
                                    ${chamado.prioridade}
                                </span>
                            </td>
                            <td>${chamado.status || 'Pendente'}</td>
                            <td>
                                ${botaoConcluir}
                                <button onclick="excluirChamado(${chamado.id})" style="background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Excluir</button>
                            </td>
                        `;
                        corpoTabela.appendChild(linha);
                    });
                } else {
                    fazerLogout();
                }
            } catch (erro) {
                console.error("Erro ao conectar com a API:", erro);
                corpoTabela.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Erro ao conectar no servidor.</td></tr>`;
            }
        }


        // UPDATE: Função para alterar o status para Concluído
        async function concluirChamado(id) {
            // Trava de segurança para evitar cliques acidentais
            if (!confirm("Deseja realmente marcar este chamado como Concluído?")) return;

            try {
                const resposta = await fetch(`https://easydesk-api.onrender.com/chamados/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ status: 'Concluído' })
                });

                if (resposta.ok) {
                    carregarChamados(); // Atualiza a tela para mostrar a mudança
                } else {
                    alert("Erro ao concluir o chamado.");
                }
            } catch (erro) {
                alert("Erro de comunicação com o servidor.");
            }
        }

        // DELETE: Função para apagar o chamado do banco de dados
        async function excluirChamado(id) {
            // Trava de segurança crítica
            if (!confirm("Atenção! Esta ação não pode ser desfeita. Deseja excluir este chamado?")) return;

            try {
                const resposta = await fetch(`https://easydesk-api.onrender.com/chamados/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resposta.ok) {
                    carregarChamados(); // Remove a linha da tela imediatamente
                } else {
                    alert("Erro ao excluir o chamado.");
                }
            } catch (erro) {
                alert("Erro de comunicação com o servidor.");
            }
        }

        // CREATE: Envio do formulário via POST para a API
        formChamado.addEventListener('submit', async function(evento) {
            evento.preventDefault(); // Evita o refresh da página

            const solicitante = document.getElementById('solicitante').value;
            const prioridade = document.getElementById('prioridade').value;
            const descricao = document.getElementById('descricao').value;

            try {
                const resposta = await fetch('https://easydesk-api.onrender.com/chamados', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` // Envia a credencial de segurança
                    },
                    body: JSON.stringify({ solicitante, prioridade, descricao })
                });

                if (resposta.ok) {
                    alert("Chamado registado com sucesso!");
                    fecharModal();
                    carregarChamados(); // Atualiza a tabela imediatamente sem dar F5
                } else {
                    alert("Erro ao criar chamado.");
                }
            } catch (erro) {
                console.error("Erro no envio:", erro);
                alert("Erro de comunicação com o servidor.");
            }
        });

        

        function fazerLogout() {
            localStorage.removeItem('tokenEasyDesk');
            window.location.href = 'index.html';
        }

        // Inicialização automática ao carregar a página
        carregarChamados();
    </script>
</body>
</html>
