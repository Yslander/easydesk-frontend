<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyDesk - Painel de Controle</title>
    <style>
        /* ================= CSS: Estilização do Painel ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6; /* Fundo levemente cinza para não cansar a vista */
            margin: 0;
            padding: 0;
        }
        
        /* Barra de navegação no topo */
        .navbar {
            background-color: #0056b3;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h1 {
            margin: 0;
            font-size: 22px;
        }
        .btn-sair {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-sair:hover {
            background-color: #c82333;
        }

        /* Container principal centralizado */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Cabeçalho acima da tabela */
        .cabecalho-tabela {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        .cabecalho-tabela h2 {
            margin: 0;
            color: #333;
        }
        .btn-novo-chamado {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-novo-chamado:hover {
            background-color: #218838;
        }

        /* Estilização da Tabela */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f1f1f1; /* Efeito visual ao passar o mouse na linha */
        }
    </style>
</head>
<body>

    <div class="navbar">
        <h1>EasyDesk - Central de Suporte</h1>
        <button class="btn-sair" onclick="fazerLogout()">Sair do Sistema</button>
    </div>

    <div class="container">
        <div class="cabecalho-tabela">
            <h2>Chamados Abertos</h2>
            <button class="btn-novo-chamado">+ Novo Chamado</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Solicitante</th>
                    <th>Descrição</th>
                    <th>Prioridade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="corpoTabela">
                <tr>
                    <td colspan="6" style="text-align: center; color: #777;">
                        Os chamados carregados do banco de dados aparecerão aqui...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Função inicial para o botão de Sair
        function fazerLogout() {
            // Remove o crachá do bolso do navegador
            localStorage.removeItem('tokenEasyDesk');
            // Manda o usuário de volta para a tela de login
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
